[project]
name = "transl-ai"
version = "0.1.0"
description = "AI translator for Godot CSV localization files, with Ollama and API support"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eduardo Gomez Blanco" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "ollama>=0.6.3",
]

[project.scripts]
transl-ai = "transl_ai.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
